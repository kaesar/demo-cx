name: deploy-dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run synth:serverless

  deploy-serverless-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # OIDC: sin claves largas. Requiere el rol `github-cx-deployer`
      # (ver README "Despliegue continuo") cuyo ARN está en el secret
      # AWS_DEPLOY_ROLE_ARN.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: npm ci
      - run: npm run deploy:serverless:dev

  # El stack Connect NO se despliega en este pipeline: la telefonía se
  # gestiona aparte (`npx cdk deploy CxConnectStack -c connectInstanceArn=...`)
  # para no tocar colas/flows en cada push del backend.
